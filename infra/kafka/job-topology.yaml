apiVersion: batch/v1
kind: Job
metadata:
  name: cron-topology
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: cron-topology
          image: rknoplock/cron-topology:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "lab-kafka-kafka-bootstrap:9092"
