apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-payment-processor
  labels:
    app: {{ .Release.Name }}-payment-processor
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-payment-processor
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-payment-processor
    spec:
      containers:
        - name: payment-processor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
