apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-producer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rknoplock/IDP.git
    targetRevision: main
    path: charts/kafka-producer
    helm:
      parameters:
        - name: replicaCount
          value: "1"
        - name: PRODUCE_INTERVAL_SECONDS
          value: "50"
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
