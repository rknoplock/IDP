apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "86.2.3"
    helm:
      values: |
        # Sem persistência por enquanto - dados em memória, perdidos em restart
        prometheus:
          prometheusSpec:
            retention: 24h
            storageSpec: {}
        alertmanager:
          alertmanagerSpec:
            storage: {}
          # desabilita alertas por enquanto, sem receiver configurado
          config:
            route:
              receiver: 'null'
            receivers:
              - name: 'null'

        grafana:
          persistence:
            enabled: false
          service:
            type: ClusterIP
            port: 3000
          # usuario admin / senha gerada, ver comando abaixo pra recuperar
          adminPassword: admin

        # ativa monitoramento automatico dos componentes do proprio cluster
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true