apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rknoplock/IDP.git
    targetRevision: main
    path: infra/kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
